name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: operations_intelligence_test
          POSTGRES_USER: operations
          POSTGRES_PASSWORD: operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operations -d operations_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://operations:operations@localhost:5432/operations_intelligence_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply database migrations
        run: psql "$TEST_DATABASE_URL" -f db/migrations/001_create_accepted_events.sql

      - name: Verify project
        run: npm run verify
